# Local-dev nginx config for `docker compose up`.
#
# This deliberately REPLACES the production nginx/conf.d (mounted via
# docker-compose.override.yml) for local runs. The production default.conf
# carries `listen 443 ssl` server blocks pointing at aaPanel certificate paths
# (/etc/panel-ssl/...) that do not exist on a dev machine — nginx validates
# every server block at boot, so one missing cert makes the whole proxy refuse
# to start. Here we serve plain HTTP on container port 80 (published to the
# host as :3100 by docker-compose.yml) and proxy to the same upstreams.
# The base compose publishes container port 3100 (3100:3100), so nginx must
# listen on 3100 here — not 80.
#
# Nothing in the real production config is changed by this file.

server {
    listen 3100;
    server_name _;

    # Allow the local frontend origins to talk to the API through nginx.
    set $cors_origin "";
    if ($http_origin ~* "^(http://localhost:3000|http://127\.0\.0\.1:3000|http://localhost:3100|http://127\.0\.0\.1:3100)$") {
        set $cors_origin $http_origin;
    }

    client_max_body_size 1G;

    # "We're updating…" page, same wiring as the production conf.d config so
    # the behaviour can be verified locally. See nginx/conf.d/default.conf.
    error_page 461 =503 /__maintenance.html;
    error_page 500 502 504 =503 /__maintenance.html;
    location = /__maintenance.html {
        root /etc/nginx/maintenance;
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After 120 always;
    }
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 503 '{"detail":"Service temporarily unavailable. We are updating - please try again shortly."}';
    }

    # Video extraction endpoint — main backend (must come before /stream/).
    location /api/v1/stream/extract {
        proxy_pass http://backend:8000/api/v1/stream/extract;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # yt-dlp streaming proxy — the separate streaming-service container.
    location /api/v1/stream/ {
        proxy_pass http://streaming-service:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1G;
    }

    # Public Meta callback: constrain this exact endpoint independently from
    # the general API upload allowance.
    location = /api/v1/whatsapp/webhook {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1M;

        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    location /api/placeholder/ {
        proxy_pass http://backend:8000/api/placeholder/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        error_page 500 502 504 = @api_unavailable;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /certificate-files/ {
        alias /var/www/certificates/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (Vite static server). The Upgrade headers keep HMR/websockets working.
    location / {
        # Manual switch: `deploy/scripts/maintenance-on.sh`.
        if (-f /etc/nginx/maintenance/ON) {
            return 461;
        }

        # SPA shell must ALWAYS revalidate: hashed /assets/ are immutable,
        # but the index.html that references them changes on every deploy.
        # Without this header browsers heuristically cache the old shell,
        # which then requests asset hashes that no longer exist — the
        # server answers with this same HTML fallback, the module MIME
        # check fails, and every route switch dies with "Connection Error".
        add_header Cache-Control "no-cache, must-revalidate" always;

        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_intercept_errors on;
    }
}
