server {
    listen 80;
    server_name _;

    # CORS Origin Mapping for dynamic origins including local IP
    set $cors_origin "";
    if ($http_origin ~* "^(https?://sashainfinity\.com|https?://www\.sashainfinity\.com|https?://lms\.sashainfinity\.com|https?://backend\.sashainfinity\.com|http://localhost:3000|http://127\.0\.0\.1:3000|http://localhost:3100|http://127\.0\.0\.1:3100|http://178\.236\.185\.167:3000|http://178\.236\.185\.167:3100)$") {
        set $cors_origin $http_origin;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com https://ajax.googleapis.com https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://www.gstatic.com https://www.googleapis.com https://apis.google.com https://checkout.razorpay.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https: https://i.ytimg.com https://img.youtube.com https://res.cloudinary.com; connect-src 'self' https: http://ws.audioscrobbler.com https://*.firebaseio.com https://*.firebase.com https://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://api.razorpay.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://*.firebaseapp.com https://iframe.mediadelivery.net https://*.mediadelivery.net https://*.razorpay.com; object-src 'none'; media-src 'self' https: blob:;" always;

    client_max_body_size 1G;

    # Public Meta callback: constrain this exact endpoint independently from
    # the general API upload allowance.
    location = /api/v1/whatsapp/webhook {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1M;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    # Backend API - use localhost for single-container setup
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # Video extraction
    location /api/v1/stream/extract {
        proxy_pass http://127.0.0.1:8000/api/v1/stream/extract;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    # Streaming service - use localhost
    location /api/v1/stream/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1G;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    # H5P package assets (review finding C1). The player runs inside an
    # <iframe sandbox="allow-scripts"> whose origin is OPAQUE, and
    # h5p-standalone loads the package via fetch() (h5p.json,
    # content/content.json, library descriptors). fetch() from an opaque
    # origin sends `Origin: null` and is treated as cross-origin, so these
    # responses need an explicit `*` ACAO or the player never boots.
    # Alias root matches the surrounding /uploads/ block (/app/uploads/).
    location /uploads/h5p/ {
        alias /app/uploads/h5p/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;

        types {
            text/html html htm;
            text/javascript js;
            text/css css;
            application/json json;
            image/svg+xml svg;
            font/woff woff;
            font/woff2 woff2;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            text/vtt vtt;
        }
        default_type application/octet-stream;
    }

    # Uploads
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization";

        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv;
            application/pdf pdf;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
        }
    }

    # Certificates
    location /certificate-files/ {
        alias /app/certificates/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
    }

    # Placeholder
    location /api/placeholder/ {
        proxy_pass http://127.0.0.1:8000/api/placeholder/;
        proxy_set_header Host $host;
    }

    # Models - serve static files
    location /models/ {
        alias /app/frontend/dist/models/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
    }

    # Frontend - serve static files (catch-all)
    location / {
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;

        # HTML files - no cache
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # JS/CSS with content hashes
        location ~* ^/assets/.*\-[A-Za-z0-9]+\.(js|css)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        # Static assets
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            add_header Cache-Control "public, max-age=86400" always;
        }
    }
}
