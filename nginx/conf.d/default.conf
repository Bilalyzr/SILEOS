# HTTP → HTTPS redirect
server {
    listen 80;
    server_name sashainfinity.com www.sashainfinity.com;
    return 301 https://sashainfinity.com$request_uri;
}

# mail.sashainfinity.com - return 444 (close connection) until mail server is properly configured
server {
    listen 443 ssl;
    server_name mail.sashainfinity.com;

    ssl_certificate /etc/panel-ssl/sashainfinity.com/fullchain.pem;
    ssl_certificate_key /etc/panel-ssl/sashainfinity.com/privkey.pem;

    return 444;
}

# attendance.shailog.com - completely shutdown (return 444)
server {
    listen 443 ssl;
    server_name attendance.shailog.com;

    ssl_certificate /etc/panel-ssl/sashainfinity.com/fullchain.pem;
    ssl_certificate_key /etc/panel-ssl/sashainfinity.com/privkey.pem;

    return 444;
}

# Direct IP / port 3100 access (fallback while DNS propagates or for debugging)
server {
    listen 3100;
    server_name _;

    # CORS Origin Mapping
    set $cors_origin "";
    if ($http_origin ~* "^(https?://sashainfinity\.com|https?://www\.sashainfinity\.com|https?://lms\.sashainfinity\.com|http://localhost:3000|http://127\.0\.0\.1:3000|http://localhost:3100|http://127\.0\.0\.1:3100|http://178\.236\.185\.167:3000|http://178\.236\.185\.167:3100)$") {
        set $cors_origin $http_origin;
    }

    client_max_body_size 1G;

    # "We're updating…" page — see the HTTPS block below for the full rationale.
    error_page 461 =503 /__maintenance.html;
    error_page 500 502 504 =503 /__maintenance.html;
    location = /__maintenance.html {
        root /etc/nginx/maintenance;
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After 120 always;
    }
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        # Without CORS on this response the browser blocks the body and the app
        # reports an opaque network error instead of this message.
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 503 '{"detail":"Service temporarily unavailable. We are updating - please try again shortly."}';
    }

    # Public Meta callback: constrain this exact endpoint independently from
    # the general API upload allowance.
    location = /api/v1/whatsapp/webhook {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1M;

        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        # API clients get JSON, never the HTML page — axios would choke on HTML.
        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    # H5P package assets (review finding C1). The player runs in an
    # <iframe sandbox="allow-scripts"> with an OPAQUE origin, and
    # h5p-standalone fetch()es h5p.json / content.json / library descriptors.
    # fetch() from an opaque origin sends `Origin: null` and is treated as
    # cross-origin, so these responses need an explicit `*` ACAO or the
    # player never boots. Must precede `location /uploads/` in the file for
    # readability; nginx picks the LONGEST matching prefix regardless.
    location /uploads/h5p/ {
        alias /var/www/uploads/h5p/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;

        types {
            text/html html htm;
            text/javascript js;
            text/css css;
            application/json json;
            image/svg+xml svg;
            font/woff woff;
            font/woff2 woff2;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            text/vtt vtt;
        }
        default_type application/octet-stream;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $cors_origin;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        error_page 500 502 504 = @api_unavailable;
    }

    location / {
        # Manual switch: `deploy/scripts/maintenance-on.sh`.
        if (-f /etc/nginx/maintenance/ON) {
            return 461;
        }

        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_intercept_errors on;
    }
}

# HTTPS main server
server {
    listen 443 ssl;
    server_name sashainfinity.com www.sashainfinity.com localhost;

    ssl_certificate /etc/panel-ssl/sashainfinity.com/fullchain.pem;
    ssl_certificate_key /etc/panel-ssl/sashainfinity.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # CORS Origin Mapping for dynamic origins including local IP
    set $cors_origin "";
    if ($http_origin ~* "^(https?://sashainfinity\.com|https?://www\.sashainfinity\.com|https?://lms\.sashainfinity\.com|https?://backend\.sashainfinity\.com|http://localhost:3000|http://127\.0\.0\.1:3000|http://localhost:3100|http://127\.0\.0\.1:3100|http://178\.236\.185\.167:3000|http://178\.236\.185\.167:3100)$") {
        set $cors_origin $http_origin;
    }

    # Security headers - Simplified to prevent connection resets
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # NOTE: `media-src` was absent here, so it inherited `default-src 'self'` and
    # blocked video playback that is not same-origin: hls.js drives the element
    # through a `blob:` MediaSource, and Bunny/YouTube streams come off their own
    # CDN hosts. `frame-src` likewise had no mediadelivery.net, which blocks the
    # Bunny iframe fallback. Both are required for lesson video to play.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://ajax.googleapis.com https://www.gstatic.com https://www.youtube.com https://checkout.razorpay.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' https: blob: data:; connect-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://iframe.mediadelivery.net https://*.mediadelivery.net https://*.b-cdn.net https://*.razorpay.com;" always;

    client_max_body_size 1G;

    # ---------------------------------------------------------------------
    # "We're updating… we'll get back to you soon!" page.
    #
    # Fires whenever an upstream container is unreachable or erroring — which
    # is exactly what happens while `docker compose up --build` recreates the
    # frontend/backend — instead of nginx's bare "502 Bad Gateway".
    #
    # Served as 503 (not 502/500) with Retry-After so crawlers treat it as a
    # temporary outage and don't drop pages from the index.
    #
    # The page itself is deploy/nginx/maintenance/__maintenance.html, shared
    # with the blue-green edge stack and mounted here at /etc/nginx/maintenance
    # (see docker-compose.yml). One page, one flag file, one pair of scripts —
    # whichever stack is serving traffic. It is entirely self-contained, so it
    # renders with every app container stopped.
    #
    # 503 is deliberately absent from the list: nginx also emits 503 for
    # rate-limiting, and the manual gate below routes through 461 instead so a
    # genuine backend 503 is never rewritten into "we're updating".
    # ---------------------------------------------------------------------
    error_page 461 =503 /__maintenance.html;
    error_page 500 502 504 =503 /__maintenance.html;
    location = /__maintenance.html {
        root /etc/nginx/maintenance;
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After 120 always;
    }

    # API callers get JSON instead of the HTML page — the frontend's axios
    # error handling parses the body, and an HTML 502 surfaces as a confusing
    # "Unexpected token <" rather than a clean "service unavailable".
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        # Without CORS on this response the browser blocks the body and the app
        # reports an opaque network error instead of this message.
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 503 '{"detail":"Service temporarily unavailable. We are updating - please try again shortly."}';
    }

    # Handle OPTIONS for CORS preflight requests first
    location ~* ^/api/.*/options$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Public Meta callback: constrain this exact endpoint independently from
    # the general API upload allowance.
    location = /api/v1/whatsapp/webhook {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1M;

        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    # Backend API (other endpoints)
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # CORS headers
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    # Health check — also what the maintenance page polls to auto-reload once
    # the stack is back, so it must answer JSON rather than the HTML page.
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        error_page 500 502 504 = @api_unavailable;
    }

    # Edgyy hosted payment page
    location /pay {
        proxy_pass http://backend:8000/pay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Video extraction endpoint - route to main backend (must come before /stream/)
    location /api/v1/stream/extract {
        proxy_pass http://backend:8000/api/v1/stream/extract;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # CORS headers
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    # Backend API streaming
    location /api/v1/stream/ {
        proxy_pass http://backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-specific optimizations
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1G;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # CORS headers
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
    }

    # SEO infrastructure — exact-match locations so the SPA fallback (and the
    # crawler diversion inside it) can never intercept these. The backend
    # generates robots.txt and sitemap.xml from PUBLISHED blog posts.
    # (SEO audit 2026-08-21, Findings 3 & 4.)
    location = /robots.txt {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend - check for crawlers and route appropriately
    location / {
        # Planned-maintenance switch. deploy/scripts/maintenance-on.sh creates
        # the flag file, which parks every page load on the "We're updating…"
        # page until maintenance-off.sh removes it. Tested per request, so it
        # takes effect with no reload. Use it around a destructive migration.
        if (-f /etc/nginx/maintenance/ON) {
            return 461;
        }

        # Crawler detected - proxy to backend prerender endpoint
        if ($is_crawler = 1) {
            proxy_pass http://backend:8000/_prerender$uri;
            break;
        }

        # Not a crawler - proxy to frontend
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for frontend to prevent connection resets on large assets
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Show the maintenance page for 5xx the frontend/prerender upstream
        # returns itself, not just for "container is unreachable". Deliberately
        # NOT set on /api/v1 — the backend's own JSON error bodies must survive.
        proxy_intercept_errors on;

        # HTML files - NEVER cache (bypass all caches)
        location ~* \.html$ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # JS/CSS with content hashes - cache disabled temporarily for updates
        # Matches patterns like index-C1DIXjVO.js or vendor-vA4cx1mx.css
        location ~* ^/assets/.*\-[A-Za-z0-9]+\.(js|css)$ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Other static assets - cache 1 day
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400" always;
        }
    }

    # H5P package assets (review finding C1) — see the identical block in the
    # server above for the full rationale: h5p-standalone fetch()es these
    # from an opaque-origin sandboxed iframe, so they need ACAO:* to load.
    location /uploads/h5p/ {
        alias /var/www/uploads/h5p/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;

        types {
            text/html html htm;
            text/javascript js;
            text/css css;
            application/json json;
            image/svg+xml svg;
            font/woff woff;
            font/woff2 woff2;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            text/vtt vtt;
        }
        default_type application/octet-stream;
    }

    # Serve uploaded files directly from nginx. The uploads host dir is
    # bind-mounted into this container at /var/www/uploads (see compose).
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization";

        # Proper MIME types for media
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv;
            application/pdf pdf;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
        }
    }

    # Certificate files
    location /certificate-files/ {
        # nginx mounts the certificates dir at /var/www/certificates (see
        # docker-compose.yml). /app/certificates only exists in the backend
        # container, so the old alias 404'd every certificate download.
        alias /var/www/certificates/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
    }

    # Placeholder images - proxy to backend
    location /api/placeholder/ {
        proxy_pass http://backend:8000/api/placeholder/;
        proxy_set_header Host $host;
    }

    # 3D models - proxy to frontend
    location /models/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
    }
}
