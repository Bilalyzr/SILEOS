name: sasha-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://tutor:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tutor_lms
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  VIDEO_SECRET: ${VIDEO_SECRET:?VIDEO_SECRET is required}
  JITSI_JWT_SECRET: ${JITSI_JWT_SECRET:?JITSI_JWT_SECRET is required}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}
  CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:?CODE_RUNNER_TOKEN is required}
  ENVIRONMENT: production
  BACKGROUND_TASK_MODE: worker
  OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:?Set a persistent AI vault encryption key}
  DEBUG: "false"
  RELEASE_TAG: ${RELEASE_TAG:-staging-local}
  DEPLOY_COLOR: staging
  FRONTEND_URL: http://127.0.0.1:${STAGING_HTTP_PORT:-3200}
  BACKEND_URL: http://127.0.0.1:${STAGING_HTTP_PORT:-3200}
  DOMAIN: localhost
  CORS_ORIGINS: '["http://127.0.0.1:${STAGING_HTTP_PORT:-3200}","http://localhost:${STAGING_HTTP_PORT:-3200}"]'
  ALLOWED_HOSTS: '["127.0.0.1","localhost","backend","nginx"]'
  ADMIN_EMAIL: ${ADMIN_EMAIL:-staging-admin@example.org}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-sasha_staging_admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
  ADMIN_FIRST_NAME: SashaInfinity
  ADMIN_LAST_NAME: Staging
  AUTO_VERIFY_EMAIL: "false"
  DEFAULT_TIMEZONE: Asia/Kolkata
  JITSI_PUBLIC_URL: ${JITSI_PUBLIC_URL:-https://live.staging.invalid}
  JITSI_JWT_APP_ID: sashainfinity-staging
  JITSI_RECORDINGS_DIR: /app/recordings_live
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-self_hosted}
  TRANSCRIPTION_PYTHON: ${TRANSCRIPTION_PYTHON:-}
  TRANSCRIPTION_MODEL_PATH: ${TRANSCRIPTION_MODEL_PATH:-/app/transcription_models}
  TRANSCRIPTION_DEVICE: ${TRANSCRIPTION_DEVICE:-cpu}
  TRANSCRIPTION_COMPUTE_TYPE: ${TRANSCRIPTION_COMPUTE_TYPE:-int8}
  RAZORPAY_KEY: ${RAZORPAY_KEY:-}
  RAZORPAY_SECRET: ${RAZORPAY_SECRET:-}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-noreply@staging.invalid}
  ALERT_ON_SECURITY_EVENTS: "false"
  SECURITY_ALERT_EMAIL: ${ADMIN_EMAIL:-staging-admin@example.org}
  BUNNY_LIBRARY_ID: ${BUNNY_LIBRARY_ID:-}
  BUNNY_API_KEY: ${BUNNY_API_KEY:-}
  BUNNY_CDN_HOSTNAME: ${BUNNY_CDN_HOSTNAME:-}
  BUNNY_TOKEN_AUTH_KEY: ${BUNNY_TOKEN_AUTH_KEY:-}
  FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
  WHATSAPP_BUSINESS_PHONE: ${WHATSAPP_BUSINESS_PHONE:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  SELLER_GSTIN: ${SELLER_GSTIN:-}
  SELLER_LEGAL_NAME: ${SELLER_LEGAL_NAME:-}
  SELLER_ADDRESS: ${SELLER_ADDRESS:-}
  SELLER_STATE_CODE: ${SELLER_STATE_CODE:-}
  ENABLE_API_RATE_LIMITING: "true"
  ENABLE_REQUEST_LOGGING: "true"
  ENABLE_SECURITY_HEADERS: "true"
  ENABLE_SECURITY_MONITORING: "true"
  SECURITY_ENABLE_HSTS: "false"
  SECURITY_FRAME_OPTIONS: DENY
  RATE_LIMIT_REQUESTS_PER_MINUTE: "120"
  RATE_LIMIT_REQUESTS_PER_HOUR: "3000"
  MIN_PASSWORD_LENGTH: "12"
  MAX_FILE_SIZE: "104857600"
  UPLOAD_DIR: /app/uploads
  LOG_FILE_PATH: /var/log/sasha_lms
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tutor_lms
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    ports:
      - "127.0.0.1:${STAGING_POSTGRES_PORT:-15433}:5432"
    volumes:
      - staging-postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./database/schemas:/docker-entrypoint-initdb.d/schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor_lms"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [staging-net]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${STAGING_REDIS_PORT:-16380}:6379"
    volumes:
      - staging-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [staging-net]
    logging: *default-logging

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-environment
    command:
      - sh
      - -c
      - >-
        python -c "import asyncio; from app.core.database import init_db; asyncio.run(init_db())"
        && python -m alembic upgrade head
        && python -m alembic current
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [staging-net]
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment: *backend-environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:${STAGING_BACKEND_PORT:-8200}:8000"
    volumes: &staging-app-volumes
      - staging-uploads:/app/uploads
      - staging-certificates:/app/certificates
      - ./certificates/template.html:/app/certificates/template.html:ro
      - ./certificates/templates:/app/certificates/templates:ro
      - ./certificates/assets:/app/certificates/assets:ro
      - ./certificates/thumbnails:/app/certificates/thumbnails:ro
      - staging-invoices:/app/invoices
      - staging-ebooks:/app/ebooks
      - staging-recordings:/app/recordings_live:ro
      - staging-logs:/var/log/sasha_lms
      - ./deploy/secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    networks: [staging-net]
    logging: *default-logging

  runtime-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment: *backend-environment
    command: ["python", "-m", "app.workers.runtime"]
    volumes: *staging-app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.runtime", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 120s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    networks: [staging-net]
    logging: *default-logging

  recording-worker:
    profiles: [recording]
    extends:
      service: runtime-worker
    command: ["python", "-m", "app.workers.recording_lessons"]
    volumes:
      - ./deploy/transcription_models:/app/transcription_models:ro
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:${STAGING_HTTP_PORT:-3200}/api/v1
        VITE_BACKEND_URL: http://127.0.0.1:${STAGING_HTTP_PORT:-3200}
        VITE_FRONTEND_URL: http://127.0.0.1:${STAGING_HTTP_PORT:-3200}
        VITE_RAZORPAY_KEY: ${RAZORPAY_KEY:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    networks: [staging-net]
    logging: *default-logging

  streaming:
    build:
      context: ./streaming-service
      dockerfile: Dockerfile
    environment:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RELEASE_TAG: ${RELEASE_TAG:-staging-local}
      DEPLOY_COLOR: staging
    ports:
      - "127.0.0.1:${STAGING_STREAMING_PORT:-8201}:8001"
    volumes:
      - staging-stream-cache:/app/yt_dlp_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    networks: [staging-net]
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-3200}:3100"
    volumes:
      - ./nginx/conf.d.local:/etc/nginx/conf.d:ro
      - ./deploy/nginx/maintenance:/etc/nginx/maintenance:ro
      - staging-uploads:/var/www/uploads:ro
      - staging-certificates:/var/www/certificates:ro
      - ./models:/var/www/models:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    networks: [staging-net]
    logging: *default-logging

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/secrets/metrics-token:/run/secrets/metrics-token:ro
      - staging-metrics:/prometheus
    networks: [staging-net]
    mem_limit: 512m
    restart: unless-stopped

  code-judge-worker:
    profiles: [coding]
    build:
      context: ./code-judge-worker
      dockerfile: Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN}
      CODE_RUNNER_VERSION: ${CODE_RUNNER_VERSION:-judge0-worker-1.0}
      CODE_RUNNER_POLL_SECONDS: ${CODE_RUNNER_POLL_SECONDS:-1}
      JUDGE0_URL: ${JUDGE0_URL:-}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    networks: [staging-net]
    logging: *default-logging

volumes:
  staging-metrics:
  staging-postgres:
  staging-redis:
  staging-uploads:
  staging-certificates:
  staging-invoices:
  staging-ebooks:
  staging-recordings:
  staging-logs:
  staging-stream-cache:

networks:
  staging-net:
    driver: bridge
