services:
  # Production Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      - VITE_API_URL=https://api.sashainfinity.com
      - VITE_RAZORPAY_KEY=${RAZORPAY_KEY}
    depends_on:
      - backend
    networks:
      - tutor-network
    restart: always

  # Production Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - AI_CREDENTIAL_ENCRYPTION_KEY=${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      - RAZORPAY_KEY=${RAZORPAY_KEY}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET}
      - ENVIRONMENT=production
      - SENTRY_DSN=${SENTRY_DSN}
      - MIN_WITHDRAWAL_INR=${MIN_WITHDRAWAL_INR:-500}
      - ALERT_ON_SECURITY_EVENTS=${ALERT_ON_SECURITY_EVENTS:-true}
      - SECURITY_ALERT_EMAIL=${SECURITY_ALERT_EMAIL:-admin@sashainfinity.com}
      # Bunny.net CDN (course video streaming) — bunny.py reads these via
      # os.getenv(), so they must be in the container environment.
      - BUNNY_LIBRARY_ID=${BUNNY_LIBRARY_ID:-618286}
      - BUNNY_API_KEY=${BUNNY_API_KEY}
      - BUNNY_CDN_HOSTNAME=${BUNNY_CDN_HOSTNAME:-vz-60dda74a-f32.b-cdn.net}
      - BUNNY_TOKEN_AUTH_KEY=${BUNNY_TOKEN_AUTH_KEY:-}
      - BUNNY_SIGNED_URL_TTL=${BUNNY_SIGNED_URL_TTL:-3600}
    volumes:
      - ./uploads:/app/uploads
      - ./backend/three_d:/app/three_d
      - ./certificates:/app/certificates
      # Invoice PDFs are legal documents and must outlive the container.
      # invoice_pdf.py writes them CWD-relative and this image's WORKDIR is
      # /app, so they land in /app/invoices.
      - ./invoices:/app/invoices
      # Private ebook library files (paid content) must outlive the
      # container for the same reason. library_storage.py resolves
      # EBOOKS_ROOT to <backend package dir>/ebooks; this image's WORKDIR
      # is /app, so it lands in /app/ebooks.
      - ./ebooks:/app/ebooks
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - tutor-network
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Production Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backups:/backups
    networks:
      - tutor-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Production Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - tutor-network
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Production Nginx with SSL
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./deploy/nginx/maintenance:/etc/nginx/maintenance:ro
      - ./uploads:/var/www/uploads
      - ./certificates:/var/www/certificates
      - ./nginx/ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tutor-network
    restart: always

volumes:
  postgres_data:
    external: true
  redis_data:
    external: true

networks:
  tutor-network:
    driver: bridge
