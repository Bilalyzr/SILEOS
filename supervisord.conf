[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
directory=/app/backend
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/backend.log
environment=PYTHONPATH=/app/backend,PYTHONUNBUFFERED=1
stopsignal=INT

[program:streaming]
command=python video_streaming.py
directory=/app/streaming
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/streaming.log
environment=PYTHONUNBUFFERED=1
stopsignal=INT

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nginx.log

[program:health-check]
command=/bin/sh -c "while true; do curl -f http://localhost:8000/health && curl -f http://localhost:8001/health; sleep 30; done"
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/health.log