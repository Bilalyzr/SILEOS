name: sashalms
description: SashaInfinity LMS mobile app
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  go_router: ^13.0.0
  dio: ^5.4.0
  retrofit: ^4.0.0
  pretty_dio_logger: ^1.3.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  video_player: ^2.8.0
  chewie: ^1.7.0
  youtube_player_flutter: ^9.1.3
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.0
  pull_to_refresh: ^2.0.0
  razorpay_flutter: ^1.3.0
  flutter_bunny_video_player: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  intl: ^0.18.0
  url_launcher: ^6.2.0
  model_viewer_plus: ^1.9.0
  image_picker: ^1.0.0
  image_cropper: ^8.0.2
  permission_handler: ^11.0.0
  connectivity_plus: ^5.0.0
  dartz: ^0.10.1
  google_fonts: ^6.3.2
  app_links: ^6.3.0
  share_plus: ^12.0.2
  flutter_markdown: ^0.7.7+1
  web_socket_channel: ^3.0.3
  record: ^6.2.1
  flutter_pcm_sound: ^3.3.3
  fl_chart: ^0.69.0
  flutter_widget_from_html: ^0.17.2
  http_parser: ^4.1.2
  # Official Jitsi Flutter SDK for Live Classes (task 9 of the live-classes
  # plan) — NOT the discontinued `jitsi_meet` package (see
  # docs/superpowers/specs/2026-09-02-live-classes-deviations.md item 8).
  # Pinned to the plan's binding version (^10.2.0); pub.dev's current latest
  # is 13.1.1, but the SDK's major-version API surface could not be verified
  # by compiling against this project (no local Flutter toolchain — see the
  # Task 9 report), so the plan's conservative pin is kept. Re-verify and
  # bump when the owner can compile.
  jitsi_meet_flutter_sdk: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  mockito: ^5.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  integration_test:
    sdk: flutter

# Native launch screen (shown on cold start before Flutter loads).
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/app_icon_foreground.png"
  android: true
  ios: true
  web: false
  android_12:
    image: "assets/icon/app_icon_foreground.png"
    color: "#FFFFFF"

# App launcher icon (the SashaInfinity logo). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#F97316"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/models/ar_thumbnails/
