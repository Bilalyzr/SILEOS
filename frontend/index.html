<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://sashainfinity.com/brand/share-default.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Brand font (self-hosted, declared in styles/astra-glass.css) is needed
         on every route; preloading avoids the fallback-font swap flash. -->
    <link rel="preload" href="/design/fonts/PlusJakartaSans.ttf" as="font" type="font/ttf" crossorigin />
    <!-- Matches the Aurum dark canvas so mobile browser chrome doesn't flash white. -->
    <meta name="theme-color" content="#050505" />

    <!-- Primary Meta Tags -->
    <title>SashaInfinity - Premium Technology Learning Platform</title>
    <meta name="title" content="SashaInfinity - Premium Technology Learning Platform" />
    <meta name="description" content="SashaInfinity - Master cutting-edge technologies with expert-led courses in full stack development, AI, cloud computing, and more. Advance your career with premium technology education." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sashainfinity.com/" />
    <meta property="og:title" content="SashaInfinity - Premium Technology Learning Platform" />
    <meta property="og:description" content="SashaInfinity - Master cutting-edge technologies with expert-led courses in full stack development, AI, cloud computing, and more. Advance your career with premium technology education." />
    <meta property="og:image" content="https://sashainfinity.com/brand/share-default.png" />
    <meta property="og:site_name" content="SashaInfinity LMS" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sashainfinity.com/" />
    <meta property="twitter:title" content="SashaInfinity - Premium Technology Learning Platform" />
    <meta property="twitter:description" content="SashaInfinity - Master cutting-edge technologies with expert-led courses in full stack development, AI, cloud computing, and more. Advance your career with premium technology education." />
    <meta property="twitter:image" content="https://sashainfinity.com/brand/share-default.png" />

    <!-- Additional SEO. The canonical host is sashainfinity.com (www and
         lms.sashainfinity.com 301 to it at the Cloudflare edge); useSEO
         rewrites this per route after hydration. -->
    <link rel="canonical" href="https://sashainfinity.com/" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body class="astra-theme dark" data-page-family="dashboard" data-theme="dark" data-sasha-theme="dark" data-surface="plate">
    <div id="root" class="sf-app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
