# Local-dev override. Used automatically by `docker-compose up`.
# Exposes the frontend port for direct browser access during local development.

services:
  frontend:
    ports:
      - "3000:3000"
    # Same-origin build: empty VITE_* makes the bundle use relative /api/v1.
    # The base compose would otherwise bake an absolute backend URL (its
    # ${VAR:-prod-default} turns an empty .env value into the production URL).
    # Relative keeps every browser call on the :3000 origin — one keep-alive
    # connection pool, no CORS preflights, and none of the ~200ms IPv6
    # localhost→127.0.0.1 fallback tax Docker Desktop on Windows charges per
    # new connection to a second published port. server.js proxies /api/v1,
    # /uploads/ and /certificate-files/ to the backend inside the docker
    # network, so nothing else changes.
    build:
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_BACKEND_URL: ""
        VITE_FRONTEND_URL: ""

  # The base compose never passes these into the backend container, but the
  # 2026-09-12 snapshot's fail-fast guards (routers/player.py VIDEO_SECRET,
  # main.py JITSI_JWT_SECRET + INTERNAL_TOKEN) refuse to boot in
  # ENVIRONMENT=production without them. Values come from the root .env.
  backend:
    environment:
      - VIDEO_SECRET=${VIDEO_SECRET}
      - JITSI_JWT_SECRET=${JITSI_JWT_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}

  # The production nginx/conf.d has `listen 443 ssl` blocks pointing at aaPanel
  # cert paths (/etc/panel-ssl/...) that don't exist on a dev box, which makes
  # nginx refuse to start. For local runs we swap in a plain-HTTP config dir
  # that serves the app on container :80 (published as :3100). This overrides
  # the base service's conf.d bind mount by targeting the same mount path.
  nginx:
    volumes:
      - ./nginx/conf.d.local:/etc/nginx/conf.d
      - ./deploy/nginx/maintenance:/etc/nginx/maintenance:ro
      - ./uploads:/var/www/uploads
      - ./certificates:/var/www/certificates
      - ./models:/var/www/models
