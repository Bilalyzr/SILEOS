# =============================================================================
# Data tier — Postgres + Redis
# =============================================================================
# This stack is deliberately NOT part of the blue-green cycle. It holds all the
# state, so it is started once and then left alone: deploys replace only the
# stateless app tier (docker-compose.app.yml). Recycling Postgres on every
# release would mean a connection drop on every release, which is exactly the
# downtime we are trying to remove.
#
#   docker compose -f deploy/docker-compose.data.yml up -d
#
# VOLUMES — READ BEFORE FIRST RUN
# The volume names below are pinned with an explicit `name:` so they do NOT get
# the usual "<project>_" prefix. That is what lets this stack adopt the volumes
# created by the original root docker-compose.yml (project "sasha_lms") instead
# of silently starting with an empty database. If your live volumes are named
# differently, check with `docker volume ls` and set POSTGRES_VOLUME /
# REDIS_VOLUME in deploy/.env.deploy accordingly.
# =============================================================================

name: sasha-data

services:
  postgres:
    image: postgres:15-alpine
    container_name: sasha-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tutor_lms}
      - POSTGRES_USER=${POSTGRES_USER:-tutor}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      # Loopback only. The app tier reaches Postgres over the shared docker
      # network; this mapping exists for psql/backups from the host.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../database/schemas:/docker-entrypoint-initdb.d/schemas:ro
    networks:
      - sasha-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutor} -d ${POSTGRES_DB:-tutor_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &default_logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: sasha-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    networks:
      - sasha-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default_logging

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-sasha_lms_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME:-sasha_lms_redis_data}

networks:
  sasha-net:
    name: ${DOCKER_NETWORK:-sasha-net}
    external: true
