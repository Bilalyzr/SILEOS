# =============================================================================
# Live Classes — Jitsi edge vhost (live.sashainfinity.com)
# =============================================================================
# Same TLS story as the main server block in 10-app.conf: TLS terminates at
# the aaPanel host / Cloudflare, this container only ever speaks plain HTTP on
# port 80. The active.conf / blue-green machinery does NOT apply here — Jitsi
# is a single stateful instance on the data tier, so this vhost proxies
# directly to the jitsi-web container by its DOCKER NETWORK NAME.
#
# IMPORTANT: proxy_pass targets http://jitsi-web:8000, NOT 127.0.0.1:8080.
# 127.0.0.1 from inside THIS edge container is the edge's own loopback, not
# the jitsi-web container — jitsi-web's host-published 127.0.0.1:8080 (see
# deploy/compose.live.yml) is for host-local health/smoke probing only. The
# edge and the Jitsi stack share the `sasha-net` docker network, so the
# service name resolves correctly there. Port 8000 (not 80) is what the
# jitsi/web:stable image's nginx actually listens on inside the container —
# verified against upstream docker-jitsi-meet's web/Dockerfile (EXPOSE 8000
# 8443) and its own docker-compose.yml ("${HTTP_PORT}:8000").
#
# websocket upgrade + a day-long read timeout are required for
# /xmpp-websocket (XMPP-over-websocket signalling) and /colibri-ws/
# (the JVB's websocket media-channel bridge) to survive a class-length call.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name live.sashainfinity.com;

    # -------------------------------------------------------------------------
    # Headers — deliberately NOT the shared snippets/security-headers.conf.
    # That snippet is tuned for the MAIN app origin and would break Jitsi here:
    #
    #   * X-Frame-Options SAMEORIGIN — JitsiStage embeds this vhost in an
    #     <iframe> served FROM sashainfinity.com/lms.sashainfinity.com, a
    #     different origin. SAMEORIGIN makes the browser refuse that embed
    #     outright, which is the whole feature broken at runtime. We emit
    #     `frame-ancestors` in our own CSP instead (below) and skip
    #     X-Frame-Options entirely — frame-ancestors supersedes it in every
    #     browser that still honours X-Frame-Options, so this is not a
    #     downgrade, just removing a directive that would conflict.
    #   * The app's CSP has `default-src 'self'` and a `connect-src` with no
    #     `wss:` — that is the RIGHT policy for sashainfinity.com's own pages,
    #     but Jitsi's web app (served BY this vhost) needs to open its own
    #     websocket connections (wss: to /xmpp-websocket, /colibri-ws/) and
    #     load its own blob:/worker: media pipeline. Applying the app's CSP
    #     here would block Jitsi's own signalling the moment someone opens
    #     live.sashainfinity.com directly (not embedded) — which is also how
    #     smoke_jitsi.sh and any direct join-link exercise this vhost.
    #     Jitsi's own web image ships CSP-appropriate behaviour for its asset
    #     pipeline; rather than hand-guess a `default-src` policy for an app
    #     we did not write, we omit one and let the iframe's origin (this
    #     vhost) govern itself. frame-ancestors is the one CSP directive that
    #     lives at the EMBEDDER'S choice, not the embedded page's, which is
    #     why it still belongs here.
    # -------------------------------------------------------------------------
    # lms.sashainfinity.com is where the app actually lives (FRONTEND_URL /
    # CORS_ORIGINS in docker-compose.app.yml) and is therefore the origin that
    # embeds JitsiStage. Omitting it made every in-app join fail to frame
    # while a direct visit to this vhost worked, which is why the apex/www
    # entries alone were not enough.
    add_header Content-Security-Policy "frame-ancestors 'self' https://lms.sashainfinity.com https://sashainfinity.com https://www.sashainfinity.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # -------------------------------------------------------------------------
    # XMPP-over-websocket signalling.
    # -------------------------------------------------------------------------
    location /xmpp-websocket {
        proxy_pass http://jitsi-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # -------------------------------------------------------------------------
    # Colibri websocket — JVB media-channel bridge.
    # -------------------------------------------------------------------------
    location /colibri-ws/ {
        proxy_pass http://jitsi-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # -------------------------------------------------------------------------
    # Everything else — the Jitsi Meet web app + external_api.js.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://jitsi-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
