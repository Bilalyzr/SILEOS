# =============================================================================
# Shared maps — evaluated per request, no upstream dependency
# =============================================================================

# Social/search crawlers get server-rendered HTML from the backend's
# /_prerender endpoint instead of the SPA shell, so link previews work.
map $http_user_agent $is_crawler {
    default 0;
    ~*twitterbot 1;
    ~*facebookexternalhit 1;
    ~*linkedinbot 1;
    ~*slackbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*slurp 1;
    ~*duckduckbot 1;
    ~*baiduspider 1;
    ~*yandexbot 1;
    ~*pinterest 1;
    ~*vkshare 1;
    ~*snapchat 1;
}

# Allow-list of CORS origins. A map is used rather than `if ($http_origin ~* ..)`
# because maps are evaluated once, cannot be nested wrongly, and do not carry
# the rewrite-phase surprises that `if` inside a location does.
#
# An origin that is not listed yields "" and no Access-Control-Allow-Origin
# header is emitted at all — which is the correct failure mode, rather than
# echoing back an arbitrary origin.
map $http_origin $cors_origin {
    default "";
    "~^https?://sashainfinity\.com$"                $http_origin;
    "~^https?://www\.sashainfinity\.com$"           $http_origin;
    "~^https?://lms\.sashainfinity\.com$"           $http_origin;
    "~^https?://backend\.sashainfinity\.com$"       $http_origin;
    "~^http://localhost:(3000|3100|3200)$"          $http_origin;
    "~^http://127\.0\.0\.1:(3000|3100|3200)$"       $http_origin;
    "~^http://178\.236\.185\.167:(3000|3100|3200)$" $http_origin;
}
