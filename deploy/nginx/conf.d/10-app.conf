# =============================================================================
# Edge server block — routes traffic to whichever colour is active
# =============================================================================
# TLS is intentionally NOT terminated here. In this deployment the host's system
# nginx (aaPanel) / Cloudflare already terminates TLS and forwards plain HTTP to
# this container's published port, so duplicating certificate handling here would
# mean two places to renew certs and two CSP header sets fighting each other.
# The X-Forwarded-Proto sent by that front proxy is honoured (see $fwd_proto) so
# the backend still generates https:// URLs.
#
# If you later drop the host proxy, add `listen 443 ssl;` plus certificate paths
# in a separate conf.d file — nothing else in this config needs to change.
# =============================================================================

# Trust the front proxy's protocol header when present, otherwise fall back to
# the scheme this connection actually used. Without this the backend sees
# "http" behind the TLS-terminating proxy and emits http:// redirects.
map $http_x_forwarded_proto $fwd_proto {
    default   $scheme;
    "~^https$" https;
    "~^http$"  http;
}

server {
    listen 80 default_server;
    # Also bind IPv6. Every in-repo probe now dials 127.0.0.1 explicitly, but
    # anything that resolves "localhost" gets ::1 first (busybox wget, curl);
    # without this listener such a probe gets ECONNREFUSED and reports the edge
    # unhealthy while it serves IPv4 traffic normally. Keep both bindings.
    listen [::]:80 default_server;
    server_name _;

    # -------------------------------------------------------------------------
    # THE SWITCH. This include defines $active_color, $up_frontend, $up_backend
    # and $up_streaming. switch.sh rewrites it and reloads nginx; that single
    # file is the entire source of truth for which colour is live.
    # -------------------------------------------------------------------------
    include /etc/nginx/active/active.conf;

    # -------------------------------------------------------------------------
    # CANONICAL HOST. Everything indexes under the bare apex; www is an alias
    # served only to bounce crawlers and users onto the canonical origin with
    # a permanent redirect (Google then consolidates any www URLs it already
    # cached onto the apex versions — duplicates age out instead of competing).
    # -------------------------------------------------------------------------
    if ($host ~ ^www\.) {
        return 301 https://sashainfinity.com$request_uri;
    }

    # -------------------------------------------------------------------------
    # MAINTENANCE GATE
    # Driven by the mere existence of /etc/nginx/maintenance/ON, which is tested
    # per request — so maintenance-on.sh / maintenance-off.sh take effect
    # instantly with no reload and no config rewrite.
    #
    # A private status code (461) is used instead of returning 503 directly, so
    # that a genuine 503 coming back from the backend is NOT rewritten into a
    # maintenance page. The response is still sent to the client as 503 with a
    # Retry-After, which is what crawlers and CDNs need to see.
    # -------------------------------------------------------------------------
    set $maintenance 0;

    if (-f /etc/nginx/maintenance/ON) {
        set $maintenance 1;
    }

    # Exemptions, and this list is not optional:
    #
    #  * /health and /__edge/ — monitoring must not go blind during maintenance,
    #    and the deploy scripts still need to verify the edge and the app tier.
    #
    #  * /__maintenance.html — REQUIRED for correctness, not convenience. The
    #    error_page below performs an internal redirect to it, and nginx re-runs
    #    the server rewrite phase (these `if` blocks) on every internal redirect.
    #    Without this exemption the maintenance page would itself be gated,
    #    return 461 again, and nginx would abort the request with
    #    "rewrite or internal redirection cycle" — a 500 instead of the
    #    maintenance page, in the exact situation where you need it to work.
    if ($uri ~ ^/(health|__edge/|__maintenance\.html$)) {
        set $maintenance 0;
    }

    if ($maintenance = 1) {
        return 461;
    }

    error_page 461 =503 /__maintenance.html;

    # -------------------------------------------------------------------------
    # UNPLANNED OUTAGE — same page, without anyone having to flip the flag.
    #
    # The gate above covers maintenance we chose. This covers the far more common
    # case: an upstream is simply not there (container recreating mid-build, OOM,
    # crash loop), where nginx would otherwise emit its bare "502 Bad Gateway".
    #
    # Only errors NGINX ITSELF generates are caught here — connection refused,
    # connect/read timeout. Upstream-generated 5xx pass through untouched because
    # proxy_intercept_errors stays off everywhere except `location /`, which
    # preserves the property the 461 dance was built for: a real 503 from the
    # backend is still a real 503, not a maintenance page.
    #
    # Sent as 503 + Retry-After rather than 502 so crawlers and CDNs treat it as
    # temporary instead of caching a hard failure or de-indexing the page.
    # -------------------------------------------------------------------------
    error_page 500 502 504 =503 /__maintenance.html;

    # -------------------------------------------------------------------------
    # FAVICON — browsers auto-request /favicon.ico. Return 204 to prevent 502.
    # The real favicon is a PNG linked in <head>, not /favicon.ico.
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /__maintenance.html {
        internal;
        root /etc/nginx/maintenance;
        default_type text/html;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Maintenance-Mode "on" always;
    }

    # API callers must get JSON, never the HTML page: the frontend parses the
    # error body, and an HTML 502 surfaces to users as "Unexpected token <"
    # instead of a clean "service unavailable". Referenced by every /api and
    # /health location below.
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 503 '{"detail":"Service temporarily unavailable. We are updating - please try again shortly."}';
    }

    # Security headers (see the snippet for why this is an include, not inline).
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 1G;

    # =========================================================================
    # EDGE-LOCAL ENDPOINTS — answered by nginx itself, never proxied.
    # These must keep working when both colours are down, which is exactly when
    # you need them.
    # =========================================================================
    location = /__edge/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","component":"edge"}';
    }

    location = /__edge/active {
        access_log off;
        default_type application/json;
        return 200 '{"active_color":"$active_color","backend":"$up_backend","frontend":"$up_frontend","streaming":"$up_streaming"}';
    }

    # =========================================================================
    # BACKEND
    # =========================================================================
    # Every proxy_pass below goes through a variable so the target is re-resolved
    # per request. A bare `proxy_pass http://$var;` with no URI part forwards the
    # original request URI unchanged, which is what the backend expects (its
    # routers are mounted at /api/v1 already).

    # Deploy/monitoring probes, forwarded to the live colour.
    # These answer JSON when the app tier is down rather than the HTML page:
    # deploy scripts parse them, and the maintenance page polls /health to
    # decide when to reload a waiting visitor.
    location = /health {
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        access_log off;
        error_page 500 502 504 = @api_unavailable;
    }

    location = /health/ready {
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        access_log off;
        error_page 500 502 504 = @api_unavailable;
    }

    location = /health/version {
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        access_log off;
        error_page 500 502 504 = @api_unavailable;
    }

    # Video URL extraction runs on the BACKEND, not the streaming service.
    # Exact-match so it wins over the /api/v1/stream/ prefix below.
    location = /api/v1/stream/extract {
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
        # Restores the server-level headers this location's add_headers replaced.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # =========================================================================
    # STREAMING SERVICE
    # =========================================================================
    # The streaming service mounts its routes at the root, so /api/v1/stream/foo
    # has to become /foo.
    #
    # This is the one place the variable-upstream approach needs care. A normal
    # `proxy_pass http://name/;` would strip the location prefix automatically,
    # but that form is unavailable with variables. Instead the URI is rewritten
    # first: `break` ends rewrite processing while staying in this location, and
    # because the rewrite clears nginx's "unparsed URI is still valid" flag,
    # a variable proxy_pass with no URI part forwards the REWRITTEN uri (plus the
    # original query string) rather than the original one. That is exactly what we
    # want, and it is why there is no trailing slash on the proxy_pass below.
    location /api/v1/stream/ {
        rewrite ^/api/v1/stream/(.*)$ /$1 break;
        proxy_pass http://$up_streaming;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # Video: stream bytes straight through instead of buffering whole
        # responses to disk, and let range requests work.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1G;

        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
        # Restores the server-level headers this location's add_headers replaced.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # =========================================================================
    # INTERNAL API — never proxied. /api/v1/internal/live/recordings is the
    # finalize worker's server-to-server ingest callback; the worker runs on
    # this host and talks to the backend's 127.0.0.1-bound port directly (see
    # docker-compose.app.yml "WORKER LOOPBACK PORT"), so the edge has no
    # legitimate reason to forward this prefix at all. 404 rather than 403 so
    # the edge does not confirm the endpoint exists. Defense in depth only —
    # the endpoint independently requires X-Internal-Token AND refuses any
    # request carrying X-Forwarded-For/Host, which nginx always sets.
    # Must stay ABOVE the general /api/v1/ location; nginx picks the longest
    # matching prefix regardless of order, so this is for readability.
    # =========================================================================
    location /api/v1/internal/ {
        access_log off;
        return 404;
    }

    # =========================================================================
    # LIVE CLASSES API — narrower rate limit (join-token minting, heartbeats,
    # SSE poll streams), so a flood on /api/v1/live/ cannot exhaust the general
    # `api` zone's budget for the rest of the platform. Must stay ABOVE the
    # general /api/v1/ location below so this more specific prefix wins.
    # Proxy directives copied verbatim from the /api/v1/ location.
    # =========================================================================
    location /api/v1/live/ {
        limit_req zone=live_api burst=20 nodelay;
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        error_page 500 502 504 = @api_unavailable;

        # The backend's CORS middleware and this block would otherwise both emit
        # Access-Control-Allow-Origin, and browsers reject duplicated values.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
        # Restores the server-level headers this location's add_headers replaced.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # =========================================================================
    # MAIN API
    # =========================================================================
    # Meta sends public webhook verification and delivery callbacks here. Keep
    # this exact route on a small body budget so an unauthenticated request
    # cannot inherit the general API's 100 MB upload allowance.
    location = /api/v1/whatsapp/webhook {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1M;

        error_page 500 502 504 = @api_unavailable;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/v1/ {
        # Edge-level rate limit (10r/s per real client IP, burst 40) — the
        # FastAPI middleware still enforces per-user limits; this stops
        # floods from ever reaching the backend. Removed-flood note: real
        # client IPs come from CF-Connecting-IP (see nginx.conf real_ip).
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;

        error_page 500 502 504 = @api_unavailable;

        # The backend's CORS middleware and this block would otherwise both emit
        # Access-Control-Allow-Origin, and browsers reject duplicated values.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Cache-Control, Pragma, Expires, X-Build-Timestamp, X-Requested-With" always;
        # Restores the server-level headers this location's add_headers replaced.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Edgyy hosted payment page (server-rendered by the backend).
    location /pay {
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /api/placeholder/ {
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # SEO infrastructure — exact-match locations so the SPA fallback below
    # (and its crawler diversion) can never intercept these. The backend
    # generates both from PUBLISHED blog posts. Variable proxy_pass with no
    # URI part forwards the original URI, which is exactly right here.
    # (SEO audit 2026-08-21, Findings 3 & 4.)
    location = /robots.txt {
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://$up_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # =========================================================================
    # SHARED STATIC STATE — served off disk by the edge
    # =========================================================================
    # These are host directories shared by both colours, so they are served
    # directly rather than proxied: one less hop, and they stay available even
    # mid-switch when no app container is reachable.
    # H5P package assets (review finding C1). The H5P player document runs
    # inside an <iframe sandbox="allow-scripts"> WITHOUT allow-same-origin,
    # so the browser gives it a unique OPAQUE origin. h5p-standalone loads
    # the package with fetch() (h5p.json, content/content.json, library
    # descriptors) rather than plain script/img tags, and a fetch() from an
    # opaque origin carries `Origin: null` and is treated as cross-origin —
    # without an explicit `*` ACAO the browser discards the response and the
    # player never boots. The assets sit behind an unguessable 32-hex
    # public_id, so `*` grants nothing a direct GET did not already allow;
    # nosniff + `CSP: sandbox` keep an uploaded HTML file in a package from
    # ever executing as a same-origin top-level document.
    location /uploads/h5p/ {
        alias /var/www/uploads/h5p/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;

        types {
            text/html html htm;
            text/javascript js;
            text/css css;
            application/json json;
            image/svg+xml svg;
            font/woff woff;
            font/woff2 woff2;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            text/vtt vtt;
        }
        default_type application/octet-stream;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization";

        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv;
            application/pdf pdf;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
        }
    }

    location /certificate-files/ {
        alias /var/www/certificates/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
    }

    # =========================================================================
    # FRONTEND
    # =========================================================================
    # 3D model assets ship inside the frontend build (frontend/public/models),
    # so they come from the frontend container rather than a host directory.
    # NOTE: never alias this to /var/www/models — the edge stack mounts no
    # models volume there, so every /models/* request 404s (that alias is what
    # broke the Sasha character GLB). No `types {}` override either: inside a
    # location it REPLACES the inherited MIME table and mis-serves any
    # non-GLB asset under /models/.
    location /models/ {
        proxy_pass http://$up_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # Crawlers are handed off to the backend's prerender endpoint. The
    # return-461 / error_page pattern is used instead of `proxy_pass` inside an
    # `if`, which is one of the combinations nginx handles unpredictably.
    error_page 462 = @prerender;

    location @prerender {
        proxy_pass http://$up_backend/_prerender$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    location / {
        if ($is_crawler = 1) {
            return 462;
        }

        # HTML must always revalidate: index.html references content-hashed
        # asset chunks that are REPLACED on every deploy. With no cache
        # control here, browsers (and Cloudflare) kept serving a stale
        # index.html whose chunk URLs no longer existed — the app then
        # half-loaded with silently broken pieces (missing video forms,
        # dead controls). Hashed /assets/* stay long-cached by the frontend
        # server itself; only the entry document needs this.
        add_header Cache-Control "no-cache" always;

        proxy_pass http://$up_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # The one place upstream 5xx are intercepted: a 500 from the frontend
        # container or the prerender endpoint means a broken app shell, and
        # showing the update page beats showing a stack trace. Not enabled for
        # /api — the backend's JSON error bodies must reach the client intact.
        proxy_intercept_errors on;

        # index.html must never be cached: it is the document that references the
        # content-hashed bundles, so a stale copy pins users to the old release
        # no matter how many times you deploy.
        location ~* \.html$ {
            proxy_pass http://$up_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            # Re-included because the add_header directives below would otherwise
            # discard every header inherited from the server block, CSP included.
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Content-hashed bundles (index-C1DIXjVO.js) — safe to cache forever,
        # because a new release produces new filenames.
        location ~* ^/assets/.*\-[A-Za-z0-9_]+\.(js|css)$ {
            proxy_pass http://$up_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://$up_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            add_header Cache-Control "public, max-age=86400" always;
        }
    }
}
