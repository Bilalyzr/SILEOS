<!doctype html>
<!--
  THE outage/maintenance page for the whole product. Both nginx stacks serve
  this same file:
    * deploy/nginx/conf.d/10-app.conf   (blue-green edge)  -> /etc/nginx/maintenance
    * nginx/conf.d/default.conf         (legacy compose)   -> /etc/nginx/maintenance

  It is reached two ways, and the copy has to work for both:
    1. `error_page 500 502 503 504 =503` — an upstream is unreachable or
       erroring, e.g. while `docker compose up --build` recreates the app
       containers. Unplanned, no known ETA.
    2. `error_page 461 =503` — the manual gate (deploy/scripts/maintenance-on.sh).
  So it deliberately promises no specific duration; the auto-recovery poll below
  is what actually gets people back, not a number we would have to guess.

  Served directly by nginx with no upstream involved, so it works with every app
  container stopped — which is the whole point. Entirely self-contained: no
  external stylesheet, font or script, because during an outage there is no
  guarantee any other origin is reachable. The one external reference is the
  logo on Cloudinary, and it hides itself if it fails to load.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>We're updating — SashaInfinity</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/dkjvfskhn/image/upload/v1759753621/cropped-sasha-logo-small_ejpceq.png">
<style>
  /* Brand: orange #f97316 primary, dark blue #0c4a6e secondary
     (frontend/tailwind.config.js). */
  :root {
    --bg: #082f49;
    --glow-a: rgba(249, 115, 22, 0.22);
    --glow-b: rgba(14, 165, 233, 0.20);
    --card: rgba(8, 32, 51, 0.72);
    --border: rgba(148, 163, 184, 0.18);
    --text: #ffffff;
    --muted: #94a3b8;
    --accent: #fb923c;
    --accent-solid: #f97316;
    --accent-hover: #ea580c;
    --link: #7dd3fc;
    --track: rgba(148, 163, 184, 0.16);
    --shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fb;
      --glow-a: rgba(249, 115, 22, 0.16);
      --glow-b: rgba(14, 165, 233, 0.14);
      --card: #ffffff;
      --border: #e3e8f0;
      --text: #0c4a6e;
      --muted: #64748b;
      --accent: #ea580c;
      --accent-solid: #f97316;
      --accent-hover: #ea580c;
      --link: #0284c7;
      --track: #e8edf4;
      --shadow: 0 18px 44px rgba(12, 74, 110, 0.10);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    background-image:
      radial-gradient(900px 500px at 15% -10%, var(--glow-a), transparent 60%),
      radial-gradient(700px 500px at 100% 110%, var(--glow-b), transparent 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 34rem;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 2.75rem 2rem 2.25rem;
    box-shadow: var(--shadow);
  }

  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 1.75rem; }
  .brand img { display: block; height: 40px; width: auto; }
  .brand span { font-size: 1.0625rem; font-weight: 700; letter-spacing: 0.01em; color: var(--text); }

  .mark {
    width: 74px;
    height: 74px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(249, 115, 22, 0.14);
    border: 1px solid rgba(249, 115, 22, 0.35);
    animation: breathe 2.4s ease-in-out infinite;
  }
  .mark svg { width: 34px; height: 34px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .mark svg .spin { transform-origin: 12px 12px; animation: spin 3.2s linear infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.85; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 { margin: 0 0 0.75rem; font-size: 1.6rem; line-height: 1.3; letter-spacing: -0.02em; }
  h1 .accent { color: var(--accent); }

  p { margin: 0 auto; max-width: 42ch; color: var(--muted); }
  .lead { margin-bottom: 1.6rem; }

  .bar { height: 4px; width: 100%; border-radius: 999px; overflow: hidden; background: var(--track); margin-bottom: 1.6rem; }
  .bar i { display: block; height: 100%; width: 38%; border-radius: 999px; background: linear-gradient(90deg, #f97316, #fbbf24); animation: slide 1.9s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    padding: 0.75rem 1.4rem;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent-solid); color: #ffffff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--muted); }

  #retry { display: block; margin-top: 1rem; font-size: 0.8125rem; color: var(--muted); }

  footer {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 0.8125rem;
    color: var(--muted);
  }
  footer a { color: var(--link); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    .card { padding: 2rem 1.25rem 1.75rem; border-radius: 20px; }
    h1 { font-size: 1.375rem; }
    .actions .btn { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mark, .mark svg .spin, .bar i { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img
        src="https://res.cloudinary.com/dkjvfskhn/image/upload/v1759753621/cropped-sasha-logo-small_ejpceq.png"
        alt=""
        onerror="this.style.display='none'">
      <span>SashaInfinity</span>
    </div>

    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <g class="spin"><path d="M12 3a9 9 0 1 0 9 9"></path></g>
        <circle cx="12" cy="12" r="2.4"></circle>
      </svg>
    </div>

    <h1>We're <span class="accent">updating</span>&hellip;</h1>

    <p class="lead">
      We'll get back to you soon! Our team is rolling out an update to the
      platform. Your courses and progress are safe.
    </p>

    <div class="bar" aria-hidden="true"><i></i></div>

    <div class="actions">
      <button class="btn btn-primary" type="button" onclick="window.location.reload()">Try again</button>
      <a class="btn btn-ghost" href="/">Back to home</a>
    </div>

    <small id="retry">Checking automatically&hellip;</small>

    <footer>
      SashaInfinity LMS &middot; Need help?
      <a href="mailto:support@sashainfinity.com">support@sashainfinity.com</a>
    </footer>
  </main>

  <!--
    Auto-recovery. Polls /health — which BOTH configs deliberately exempt from
    the maintenance gate — and reloads the moment the app tier answers, so
    nobody sits on a stale page after a deploy or a restart completes. Falls
    back to a plain timed reload where fetch is unavailable.
  -->
  <script>
    (function () {
      var el = document.getElementById('retry');
      var seconds = 20;

      function check() {
        if (typeof fetch !== 'function') { window.location.reload(); return; }
        fetch('/health', { cache: 'no-store' })
          .then(function (r) { if (r.ok) window.location.reload(); })
          .catch(function () { /* still down — keep waiting */ });
      }

      setInterval(function () {
        seconds -= 1;
        if (el) {
          el.textContent = seconds > 0 ? 'Checking again in ' + seconds + 's…' : 'Checking…';
        }
        if (seconds <= 0) { seconds = 20; check(); }
      }, 1000);
    })();
  </script>
</body>
</html>
