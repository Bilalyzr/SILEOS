# =============================================================================
# Edge nginx — http-level configuration
# =============================================================================
# This container is the only thing users talk to, and it is deliberately the one
# thing a deploy never restarts. Releases change which app containers it points
# at (deploy/nginx/active/active.conf) followed by `nginx -s reload`, which
# starts new workers for new connections and lets old workers finish the
# requests they are already serving. No connection is dropped.
# =============================================================================

# Stated explicitly rather than relying on the image's compiled-in default. Worker
# processes must be able to read the bind-mounted /var/www/uploads and
# /var/www/certificates; 'nginx' is the user the official image creates and the
# one the current deployment already serves those directories as.
user nginx;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Docker's embedded DNS. This is what makes the colour switch work without
    # a restart: because every upstream is referenced through a variable, nginx
    # resolves it per request via this resolver instead of pinning the IP at
    # startup. It also means nginx starts fine when the idle colour is down —
    # with a static `upstream {}` block, an unresolvable host is a fatal config
    # error and the edge would refuse to boot.
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Logging. $upstream_addr and $active_color are included so you can prove
    # from the access log which colour actually served a request — the first
    # thing you want after a switch.
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'color=$active_color upstream=$upstream_addr '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Rate-limit zones are defined but intentionally NOT applied to any location.
    # The FastAPI RateLimitMiddleware already enforces per-user limits, and
    # adding a second limiter at the edge during a deployment change would risk
    # throttling legitimate video range-requests. Attach `limit_req zone=api;`
    # in a location if you later want edge-level limiting.
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=streaming:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=live_api:10m rate=10r/s;

    # -------------------------------------------------------------------------
    # Real client IPs. Traffic arrives through Cloudflare -> host nginx ->
    # this edge, so the socket address is the host's docker gateway. Trust the
    # gateway and recover the true client from Cloudflare's header; without
    # this, the IDS deny-list (99-ids-deny.conf) and access logs would only
    # ever see 172.x addresses.
    # -------------------------------------------------------------------------
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
