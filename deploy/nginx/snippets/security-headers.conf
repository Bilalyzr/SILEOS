# =============================================================================
# Security headers — included wherever they must be present
# =============================================================================
# This exists as a snippet because of an nginx inheritance rule that bites often:
# add_header directives are NOT merged. As soon as a nested location declares any
# add_header of its own, it discards every add_header inherited from the parent.
#
# The `location ~* \.html$` block inside `location /` sets Cache-Control, which
# would therefore silently strip Content-Security-Policy from exactly the
# responses CSP applies to — the HTML documents. Including this file in both
# places keeps them in sync.
#
# Note: /etc/nginx/snippets is mounted separately from /etc/nginx/conf.d so this
# file is not swept up by the `include /etc/nginx/conf.d/*.conf` glob, which
# would try to parse it as a top-level http-context config.
# =============================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# cdnjs.cloudflare.com is in style-src and font-src because the home page injects
# the Font Awesome 6 stylesheet from there at mount (see useFontAwesome in
# Home.tsx); without both directives every <i class="fa-..."> icon renders blank.
#
# media-src and the mediadelivery.net / b-cdn.net frame-src entries are required
# for lesson video: hls.js drives the <video> element through a blob: MediaSource
# and Bunny/YouTube streams are served from their own CDN hosts.
#
# www.google.com / maps.google.com in frame-src are for the contact page's Google
# Maps embed (components/contact/MapSection.tsx). Without them the iframe is
# refused on the live site while still working in dev, where no CSP is applied.
#
# ajax.googleapis.com in script-src serves the <model-viewer> web component that
# the Meiporul AR page injects on demand (pages/meiporul-ar.tsx). worker-src
# allows blob: because model-viewer's Draco/KTX2 decoders run in blob workers,
# which would otherwise fall back to default-src 'self' and be blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://ajax.googleapis.com https://www.gstatic.com https://www.youtube.com https://checkout.razorpay.com https://static.cloudflareinsights.com https://live.sashainfinity.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' https: blob: data:; connect-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://iframe.mediadelivery.net https://*.mediadelivery.net https://*.b-cdn.net https://*.razorpay.com https://live.sashainfinity.com;" always;

# Which colour served this response. The first thing to check when verifying a
# switch, or when someone reports still seeing the previous build.
add_header X-Deploy-Color $active_color always;
